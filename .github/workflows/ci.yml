name: CI

# Runs on every push/PR: boot the terminal the way run.sh does, then prove
# every page and JSON endpoint the UI needs actually renders.  On main the
# checked commit is then published to GHCR, so `docker compose pull` always
# gets an image that passed the render checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: boot + render every page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q -x '(\.git|__pycache__|data)' .

      - name: Boot the app and render every page
        run: python ci_smoke.py --port 8000 --log ci_app.log

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-app-log-${{ github.run_id }}
          path: ci_app.log
          if-no-files-found: ignore

  publish:
    name: publish image (GHCR)
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase; GITHUB_REPOSITORY is not
      # guaranteed to be (this repo is Tony46117/mt5).
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

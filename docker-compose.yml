services:
  mt5-bridge:

    build: .
    image: mt5-bridge:latest
    container_name: mt5-bridge
    user: mt5
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:

      - MT5_MACHINE_KEY=${MT5_MACHINE_KEY:-please-change-me}
      - MT5_WINEPREFIX=/data/prefix

      - MT5_NO_LAUNCH_JITTER=${MT5_NO_LAUNCH_JITTER:-1}
      - MT5_TRADING_DAYS=${MT5_TRADING_DAYS:-0,1,2,3,4,5,6}

      - DATABASE_URL=${MT5_DATABASE_URL:-}
    volumes:
      - mt5-data:/data

      - ./data:/data/seed:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    command: ["all"]

volumes:
  mt5-data:
